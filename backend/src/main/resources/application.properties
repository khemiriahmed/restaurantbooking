spring.application.name=restaurantbooking

server.port=${SERVER_PORT:8080}

# -------------------------------------------------------------------
# Base de données
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurant_booking}
spring.datasource.username=${DB_USERNAME:restaurant_user}
spring.datasource.password=${DB_PASSWORD:restaurant_password}

# -------------------------------------------------------------------
# JPA / Hibernate
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# -------------------------------------------------------------------
# JWT
# -------------------------------------------------------------------
jwt.secret=${JWT_SECRET:VGhpc0lzQVNlY3VyZVNlY3JldEtleUZvclJlc3RhdXJhbnRCb29raW5nQXBpMTIzNDU2}
jwt.expiration=${JWT_EXPIRATION:86400000}

# -------------------------------------------------------------------
# CORS
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:4300}
