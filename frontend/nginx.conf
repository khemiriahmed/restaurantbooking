server {
    listen 80;
    server_name localhost;

    # 1. L'astuce anti-crash : Utiliser le DNS interne de Docker
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # 2. Servir l'application Angular
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 3. Proxy vers le backend (Appels API)
    location /api/ {
        # On assigne l'URL à une variable pour forcer Nginx à la résoudre à chaque requête
        set $backend_upstream http://backend:8080;
        
        # On utilise la variable ici
        proxy_pass $backend_upstream;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}