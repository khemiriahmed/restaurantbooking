<section class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-user-plus"></i>
      </div>

      <span class="section-badge"> Restaurant Booking </span>

      <h1>Créer un compte</h1>

      <p>Créez votre compte pour réserver une table.</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form class="auth-form" (ngSubmit)="register()">
      <div class="form-row">
        <div class="form-group">
          <label for="firstName"> Prénom </label>

          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>

            <input
              id="firstName"
              name="firstName"
              type="text"
              [(ngModel)]="firstName"
              placeholder="Ahmed"
              autocomplete="given-name"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="lastName"> Nom </label>

          <div class="input-wrapper">
            <i class="fa-solid fa-user"></i>

            <input
              id="lastName"
              name="lastName"
              type="text"
              [(ngModel)]="lastName"
              placeholder="Khemiri"
              autocomplete="family-name"
              required
            />
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="email"> Email </label>

        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password"> Mot de passe </label>

        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Votre mot de passe"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword"> Confirmer le mot de passe </label>

        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            placeholder="Confirmez votre mot de passe"
            autocomplete="new-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary register-button" [disabled]="loading">
        @if (loading) {
          <i class="fa-solid fa-spinner fa-spin"></i>

          Création...
        } @else {
          <i class="fa-solid fa-user-plus"></i>

          Créer mon compte
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Vous avez déjà un compte ?</p>

      <a routerLink="/login" class="login-link">
        Se connecter
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
