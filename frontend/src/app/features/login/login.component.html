<section class="auth-page">
  <div class="auth-container">
    <div class="auth-header">
      <div class="auth-icon">
        <i class="fa-solid fa-right-to-bracket"></i>
      </div>

      <span class="section-badge"> Restaurant Booking </span>

      <h1>Connexion</h1>

      <p>Connectez-vous pour gérer vos réservations.</p>
    </div>

    @if (errorMessage) {
      <div class="alert alert-error">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <form class="auth-form" (ngSubmit)="login()">
      <div class="form-group">
        <label for="email"> Email </label>

        <div class="input-wrapper">
          <i class="fa-solid fa-envelope"></i>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password"> Mot de passe </label>

        <div class="input-wrapper">
          <i class="fa-solid fa-lock"></i>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            placeholder="Votre mot de passe"
            autocomplete="current-password"
            required
          />
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-button" [disabled]="loading">
        @if (loading) {
          <i class="fa-solid fa-spinner fa-spin"></i>

          Connexion...
        } @else {
          <i class="fa-solid fa-right-to-bracket"></i>

          Se connecter
        }
      </button>
    </form>

    <div class="auth-footer">
      <p>Vous n'avez pas encore de compte ?</p>

      <a routerLink="/register" class="register-link">
        Créer un compte
        <i class="fa-solid fa-arrow-right"></i>
      </a>
    </div>
  </div>
</section>
