services:

  postgres:
    image: postgres:16
    container_name: restaurant-booking-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: restaurant_booking
      POSTGRES_USER: restaurant_user
      POSTGRES_PASSWORD: restaurant_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_user -d restaurant_booking"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - restaurant-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: restaurant-booking-backend
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/restaurant_booking
      DB_USERNAME: restaurant_user
      DB_PASSWORD: restaurant_password
      JPA_DDL_AUTO: update
      JWT_SECRET: VGhpcyBJcyBhIHNlY3VyZSBzZWNyZXQga2V5IGZvciB0aGUgcmVzdGF1cmFudCBib29raW5nIGFwcGxpY2F0aW9uISEh
      JWT_EXPIRATION: 86400000
      CORS_ALLOWED_ORIGINS: http://localhost:4200,http://localhost:4300

    ports:
      - "8080:8080"

    networks:
      - restaurant-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: restaurant-booking-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "4200:80"

    networks:
      - restaurant-network


volumes:
  postgres_data:

networks:
  restaurant-network:
    driver: bridge